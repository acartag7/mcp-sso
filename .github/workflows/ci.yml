name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lines · test · build
    runs-on: [self-hosted, Linux, ARM64, mcp-sso]

    env:
      # RUN_INTEGRATION scopes the in-file hard-fail gate to THIS job.
      RUN_INTEGRATION: "true"
      MYSQL_CONTAINER: mcp-sso-ci-mysql-${{ github.run_id }}-${{ github.run_attempt }}
      REDIS_CONTAINER: mcp-sso-ci-redis-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # SHA-pinned actions (see docs/dependency-ledger.md). Bump by resolving a new
      # tag's commit SHA and re-checking the 15-day rule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0 (2026-06-18)
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9 (2026-06-15)
        with:
          version: 10.34.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (2026-04-20)
        with:
          node-version: "24"
      # The isolated Linux VM on the Mac mini uses its Docker engine explicitly,
      # with random loopback ports so concurrent trusted jobs cannot collide.
      - name: start integration services
        run: |
          docker run --pull=always --detach --name "$MYSQL_CONTAINER" \
            --env MYSQL_ROOT_PASSWORD=rootpw \
            --env MYSQL_DATABASE=mcp_sso \
            --env MYSQL_USER=mcp \
            --env MYSQL_PASSWORD=mcppw \
            --publish 127.0.0.1::3306 \
            --health-cmd="mysqladmin ping -h 127.0.0.1 -u mcp -pmcppw --silent" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=18 \
            mysql:8.4
          docker run --pull=always --detach --name "$REDIS_CONTAINER" \
            --publish 127.0.0.1::6379 \
            --health-cmd="redis-cli ping" \
            --health-interval=5s \
            --health-timeout=3s \
            --health-retries=5 \
            redis:7-alpine

          for _ in {1..90}; do
            mysql_status="$(docker inspect --format '{{.State.Health.Status}}' "$MYSQL_CONTAINER")"
            redis_status="$(docker inspect --format '{{.State.Health.Status}}' "$REDIS_CONTAINER")"
            if [ "$mysql_status" = healthy ] && [ "$redis_status" = healthy ]; then
              break
            fi
            if [ "$mysql_status" = unhealthy ] || [ "$redis_status" = unhealthy ]; then
              docker logs "$MYSQL_CONTAINER"
              docker logs "$REDIS_CONTAINER"
              exit 1
            fi
            sleep 2
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' "$MYSQL_CONTAINER")" = healthy
          test "$(docker inspect --format '{{.State.Health.Status}}' "$REDIS_CONTAINER")" = healthy
          mysql_port="$(docker port "$MYSQL_CONTAINER" 3306/tcp | sed 's/.*://')"
          redis_port="$(docker port "$REDIS_CONTAINER" 6379/tcp | sed 's/.*://')"
          echo "MYSQL_URL=mysql://mcp:mcppw@127.0.0.1:${mysql_port}/mcp_sso?charset=utf8mb4" >> "$GITHUB_ENV"
          echo "REDIS_URL=redis://127.0.0.1:${redis_port}" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:lines
      - run: pnpm check:seams
      # B3: hard-fail if the integration env did not reach the test process.
      - name: assert integration env present
        run: |
          node -e "if(process.env.RUN_INTEGRATION!=='true'||!process.env.MYSQL_URL||!process.env.REDIS_URL){console.error('FATAL: RUN_INTEGRATION/MYSQL_URL/REDIS_URL missing — adapters would be silently skipped');process.exit(1)}else{console.log('RUN_INTEGRATION + MYSQL_URL + REDIS_URL present')}"
      - run: pnpm test
      # Build smoke: the published artifact (tsc -> dist) must compile.
      - name: build smoke
        run: pnpm build
      - name: stop integration services
        if: always()
        run: docker rm --force --volumes "$MYSQL_CONTAINER" "$REDIS_CONTAINER" 2>/dev/null || true

  # Engineering OS artifact-chain guard (freeze-hash · mixed-diff · stage-artifact).
  # Public-fork and automation-controlled workflow code must never execute on the
  # self-hosted runner. Feature refs are dispatched by a maintainer only after the
  # workflow diff is reviewed; external contributions are reviewed and mirrored.
  process-guard:
    name: process-guard
    runs-on: [self-hosted, Linux, ARM64, mcp-sso]
    steps:
      # fetch-depth: 0 — the guard needs full history to compute the merge-base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0 (2026-06-18)
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (2026-04-20)
        with:
          node-version: "24"
      - uses: acartag7/engineering-os/process-guard@c697b412abf034be7a22a53f567ec10eecc776e0 # v0.1.0
        with:
          base-ref: origin/main
          src-paths: src/
          contract-paths: >-
            docs/contracts.md,
            docs/contracts/01-purpose-and-scope.md,
            docs/contracts/02-the-two-roles.md,
            docs/contracts/03-normative-references.md,
            docs/contracts/04-design-principles.md,
            docs/contracts/05-configuration-contract.md,
            docs/contracts/06-ports.md,
            docs/contracts/07-crypto-and-token-contracts.md,
            docs/contracts/08-resource-server-verifier-contract.md,
            docs/contracts/09-as-lite-bridge-contract.md,
            docs/contracts/10-redirect-uri-policy.md,
            docs/contracts/11-scope-contract.md,
            docs/contracts/12-store-conformance-contract.md,
            docs/contracts/13-audit-contract.md,
            docs/contracts/14-error-catalog.md,
            docs/contracts/15-package-and-export-map.md,
            docs/contracts/16-spec-conformance-matrix.md,
            docs/contracts/17-v0-2-feature-contracts.md,
            docs/contracts/18-contract-change-protocol.md

  # workflow_dispatch check runs are not included in a PR's required-check
  # rollup. Publish the exact required contexts only after both enforcing jobs
  # succeed. This job never checks out or executes repository code.
  attest-dispatched-checks:
    name: attest dispatched checks
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        needs.verify.result == 'success' &&
        needs.process-guard.result == 'success'
      }}
    needs: [verify, process-guard]
    runs-on: [self-hosted, macOS, ARM64, mcp-sso-codeql]
    permissions:
      statuses: write
    steps:
      - name: publish required commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          /usr/bin/curl --fail --silent --show-error --output /dev/null \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "{\"state\":\"success\",\"context\":\"typecheck · lines · test · build\",\"description\":\"Mac mini dispatched CI passed\",\"target_url\":\"${run_url}\"}" \
            "$status_url"
          /usr/bin/curl --fail --silent --show-error --output /dev/null \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "{\"state\":\"success\",\"context\":\"process-guard\",\"description\":\"Mac mini dispatched process guard passed\",\"target_url\":\"${run_url}\"}" \
            "$status_url"
