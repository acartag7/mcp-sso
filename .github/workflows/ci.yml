name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lines · test · build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: mcp_sso
          MYSQL_USER: mcp
          MYSQL_PASSWORD: mcppw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u mcp -pmcppw --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      # RUN_INTEGRATION scopes the in-file hard-fail gate to THIS job. publish.yml
      # also runs `pnpm test` under ambient CI=true without service containers.
      RUN_INTEGRATION: "true"
      MYSQL_URL: mysql://mcp:mcppw@127.0.0.1:3306/mcp_sso?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      # SHA-pinned actions (see docs/dependency-ledger.md). Bump by resolving a new
      # tag's commit SHA and re-checking the 15-day rule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10 (2026-08-03)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: "24"
      - name: enforce dependency policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-dependency-policy.mjs --verify-remote
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:lines
      - run: pnpm check:seams
      # B3: hard-fail if the integration env did not reach the test process.
      - name: assert integration env present
        run: |
          node -e "if(process.env.RUN_INTEGRATION!=='true'||!process.env.MYSQL_URL||!process.env.REDIS_URL){console.error('FATAL: RUN_INTEGRATION/MYSQL_URL/REDIS_URL missing — adapters would be silently skipped');process.exit(1)}else{console.log('RUN_INTEGRATION + MYSQL_URL + REDIS_URL present')}"
      - run: pnpm test
      - name: run parity fixtures
        run: pnpm test:parity
      - name: build smoke
        run: pnpm build
      - name: complete shipped-feature release matrix
        run: pnpm test:release

  process-guard:
    name: process-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: "24"
      - uses: acartag7/engineering-os/process-guard@c697b412abf034be7a22a53f567ec10eecc776e0 # first-party exception (2026-07-19)
        with:
          base-ref: origin/${{ github.base_ref }}
          src-paths: src/
          contract-paths: >-
            docs/contracts.md,
            docs/contracts/01-purpose-and-scope.md,
            docs/contracts/02-the-two-roles.md,
            docs/contracts/03-normative-references.md,
            docs/contracts/04-design-principles.md,
