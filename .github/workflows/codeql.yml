name: CodeQL

# Static analysis (OpenSSF Scorecard SAST check). Runs the github/codeql-action
# JavaScript/TypeScript queries on push to main, PRs, and weekly. Actions are
# SHA-pinned with the same vetted versions ci.yml uses (docs/dependency-ledger.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly — off the :00 mark.
    - cron: "37 8 * * 1"

permissions:
  contents: read
  security-events: write # upload-sarif / CodeQL results

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9 (2026-06-15)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: "24"
          cache: pnpm
      # JS/TS CodeQL extracts from source; installing resolves modules for richer analysis.
      - run: pnpm install --frozen-lockfile
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2 (2026-06-04)
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2 (2026-06-04)
