name: CodeQL

# Static analysis (OpenSSF Scorecard SAST check). Runs the github/codeql-action
# JavaScript/TypeScript queries on main, maintainer-dispatched feature refs, and
# weekly. Actions are SHA-pinned with the same vetted versions ci.yml uses
# (docs/dependency-ledger.md).

on:
  push:
    branches: [main]
  schedule:
    # Weekly — off the :00 mark.
    - cron: "37 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # upload-sarif / CodeQL results

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: [self-hosted, macOS, ARM64, mcp-sso-codeql]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (2026-06-18)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (2026-04-20)
        with:
          node-version: "24"
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2 (2026-06-04)
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2 (2026-06-04)
