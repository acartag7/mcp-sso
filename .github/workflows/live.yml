name: live

# The release rehearsal: every live probe against the real identity providers,
# unattended. Runs nightly and on demand from main, and on any push to a
# rehearsal/* branch (how a change to the harness is proved before it merges).
# Never on a pull request. The AWS role is held by two GitHub Environments and
# nothing else: `live` (branch policy: main; unattended) and `live-branch`
# (branch policy: rehearsal/*; a required reviewer approves each run before
# the role is assumed, because the code a branch run executes is the code that
# branch pushed). A job below refuses any other ref before it does anything.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly ~03:17 UTC (off the :00 mark)
  push:
    branches: ["rehearsal/*"]

permissions: {}

concurrency:
  # One rehearsal at a time: the probes share the provider applications and a
  # later phase shares one tunnel.
  group: live
  cancel-in-progress: false

jobs:
  rehearse:
    name: release rehearsal
    runs-on: ubuntu-latest
    # main runs unattended; a rehearsal/* branch waits for the reviewer.
    environment: ${{ github.ref == 'refs/heads/main' && 'live' || 'live-branch' }}
    timeout-minutes: 30
    permissions:
      id-token: write # assume the AWS role through GitHub OIDC
      contents: read

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      # The bundle fetched from Secrets Manager stands in for the private
      # infrastructure checkout: run.sh reads stack outputs through the adapter
      # at scripts/live/ci/infra and is otherwise unchanged.
      MCP_SSO_INFRA_DIR: ${{ github.workspace }}/scripts/live/ci/infra
      MCP_SSO_ENTRA_STACK: entra
      MCP_SSO_CLOUDFLARE_STACK: cloudflare
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: refuse any ref but main or rehearsal/*
        # The environment branch policies are the trust boundary; this step
        # makes the same rule visible and enforced in the repository too.
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main|refs/heads/rehearsal/*) echo "ref admitted: $REF" ;;
            *) echo "refusing to rehearse from $REF" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10 (2026-08-03)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: require the browser the driver runs
        # The runner image's Google Chrome is what playwright-core drives; a
        # missing browser fails here, once, instead of as blocked rows.
        run: google-chrome --version
      - name: name the bundle directory
        # The runner context is not available in job-level env.
        run: echo "MCP_SSO_BUNDLE_DIR=$RUNNER_TEMP/mcp-sso-bundle" >> "$GITHUB_ENV"
      - name: assume the rehearsal role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3 (2026-07-22)
        with:
          role-to-assume: ${{ secrets.MCP_SSO_LIVE_ROLE_ARN }}
          role-session-name: mcp-sso-release-rehearsal
          aws-region: eu-central-1
      - name: fetch the live bundle
        run: node scripts/live/ci/fetch-bundle.mjs
      - name: mask every private value before anything else prints
        run: node scripts/live/ci/mask-bundle.mjs
      - name: rehearse
        run: node scripts/live/rehearsal.mjs --out "$RUNNER_TEMP/receipt.json"
      - name: remove the bundle
        if: always()
        run: rm -rf -- "$MCP_SSO_BUNDLE_DIR"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (2026-04-10)
        if: always()
        with:
          name: rehearsal-receipt-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          retention-days: 30
