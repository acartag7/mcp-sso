name: publish

# Real publication is tag-only. Manual dispatch builds the same artifact but
# can only run npm's dry-run path.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.9 (2026-06-15)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: "24"
          cache: pnpm
      - name: require tag to match package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - name: enforce dependency policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-dependency-policy.mjs --verify-remote
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:lines
      - run: pnpm check:seams
      - run: pnpm test
      - run: pnpm build
      - name: pack once and record the tarball digest
        run: |
          PACK_JSON="${RUNNER_TEMP}/npm-pack.json"
          npm pack --ignore-scripts --json > "$PACK_JSON"
          TARBALL="$(node -e 'const r=require(process.argv[1]); if(r.length!==1) process.exit(1); process.stdout.write(r[0].filename)' "$PACK_JSON")"
          case "$TARBALL" in mcp-sso-*.tgz) ;; *) exit 1 ;; esac
          test -f "$TARBALL"
          shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (2026-04-10)
        with:
          name: npm-package-${{ github.sha }}
          path: |
            mcp-sso-*.tgz
            mcp-sso-*.tgz.sha256
          if-no-files-found: error
          retention-days: 1

  dry-run:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (2026-03-11)
        with:
          name: npm-package-${{ github.sha }}
          path: package
      - name: verify and dry-run the packed artifact
        working-directory: package
        run: |
          shasum -a 256 -c mcp-sso-*.tgz.sha256
          TARBALL=(mcp-sso-*.tgz)
          test "${#TARBALL[@]}" -eq 1
          npm publish "${TARBALL[0]}" --dry-run --ignore-scripts

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (2026-03-11)
        with:
          name: npm-package-${{ github.sha }}
          path: package
      - name: verify and publish the packed artifact
        working-directory: package
        run: |
          shasum -a 256 -c mcp-sso-*.tgz.sha256
          TARBALL=(mcp-sso-*.tgz)
          test "${#TARBALL[@]}" -eq 1
          npm publish "${TARBALL[0]}" --provenance --ignore-scripts

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes --title "$TAG"
